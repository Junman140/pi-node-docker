# Pi Testnet (original) - Watcher node
#
# === HOW TO FILL IN THE VALIDATORS ===
#
# This file has __TESTNET_VALIDATOR*__ placeholders.
# Replace them with the actual Pi Testnet (original/testnet1) validator info.
#
# Methods to discover the correct values:
#
# 1. From a running Pi Testnet node: look at its /opt/stellar/core/etc/stellar-core.cfg
#    and copy the [[VALIDATORS]] sections.
#
# 2. From the Pi Core Team: check https://github.com/PiCoreTeam/pi-node-docker
#    for any testnet-specific configuration.
#
# 3. From a running stellar-core node's HTTP API:
#    curl http://<testnet-node-ip>:11626/info | jq .info.quorum
#
# 4. The Pi Core Team validator key prefix is typically GDLA3KOM, GDFDDPMCL, GAOBNDXT
#    but these may differ for the original testnet. Verify before using.
#
# 5. If the original Pi Testnet has been merged into testnet2, use the testnet2
#    config instead (pi-node-docker/testnet2/core/etc/stellar-core.cfg) with --testnet2.
#
# After filling in, verify with:
#   stellar-core --conf pi-node-docker/testnet/core/etc/stellar-core.cfg --ll info --checkquorum
#
PUBLIC_HTTP_PORT = false
PEER_PORT = 31402

COMMANDS = ["ll?level=info"]
LOG_FILE_PATH = "/tmp/stellar-core.log"
BUCKET_DIR_PATH = "/opt/stellar/core/buckets"

NETWORK_PASSPHRASE = "Pi Testnet"
KNOWN_CURSORS = ["HORIZON"]

DATABASE = "postgresql://dbname=core host=localhost user=stellar password=__PGPASS__"
CATCHUP_COMPLETE=false
CATCHUP_RECENT=256

PREFERRED_PEER_KEYS = [
    "$validator1",
    "$validator2",
    "$validator3"
]

PREFERRED_PEERS_ONLY = false

NODE_SEED = "__NODE_PRIVATE_KEY__"
NODE_IS_VALIDATOR = false

UNSAFE_QUORUM = false
FAILURE_SAFETY = -1
QUORUM_INTERSECTION_CHECKER = false

NODE_HOME_DOMAIN = "pi-core-team"

[[HOME_DOMAINS]]
HOME_DOMAIN = "pi-core-team"
QUALITY="MEDIUM"

# === Replace these placeholder validators with actual Pi Testnet (original) values ===

[[VALIDATORS]]
NAME="validator1"
HOME_DOMAIN="pi-core-team"
PUBLIC_KEY="__TESTNET_VALIDATOR1_KEY__"      # e.g. "GDFDDPMCL4WPV27Z5Q7R6I2BX3UXOHJIU6AXXIFOCUEDEA4GWU2I4TJZ"
ADDRESS="__TESTNET_VALIDATOR1_ADDR__"        # e.g. "34.152.3.42:31402"
HISTORY="curl -sf https://history.testnet.minepi.com/{0} -o {1}"

[[VALIDATORS]]
NAME="validator2"
HOME_DOMAIN="pi-core-team"
PUBLIC_KEY="__TESTNET_VALIDATOR2_KEY__"      # e.g. "GDOJPADI56GTIP46K6YSRFOSEL2BW5WCYIKPFB5ZMY7YT3H2FRSAGI4J"
ADDRESS="__TESTNET_VALIDATOR2_ADDR__"        # e.g. "35.228.163.61:31402"
HISTORY="curl -sf https://history.testnet.minepi.com/{0} -o {1}"

[[VALIDATORS]]
NAME="validator3"
HOME_DOMAIN="pi-core-team"
PUBLIC_KEY="__TESTNET_VALIDATOR3_KEY__"      # e.g. "GAOBNDXTZSMJB5N3J5V5RZLYRN4EKQS5GIT25LCQS4AIBUJ3SMVMDR2Q"
ADDRESS="__TESTNET_VALIDATOR3_ADDR__"        # e.g. "34.79.206.31:31402"
HISTORY="curl -sf https://history.testnet.minepi.com/{0} -o {1}"

[HISTORY.local]
get="cp /opt/stellar/history/local/{0} {1}"
put="cp {0} /opt/stellar/history/local/{1}"
mkdir="mkdir -p /opt/stellar/history/local/{0}"
